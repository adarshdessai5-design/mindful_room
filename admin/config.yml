backend:
  name: git-gateway
  repo: adarshdessai5-design/mindful_room
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/23a3e2e8-e47a-4eb2-a074-a037c2033ef8/pkce
  auth_token_endpoint: /sites/23a3e2e8-e47a-4eb2-a074-a037c2033ef8/token
  gateway_url: https://gateway.decapbridge.com

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image (Optional)", name: "cover_image", widget: "image", required: false, hint: "Upload a thumbnail here. If left blank, it will auto-generate from YouTube." }
      - { label: "Video Link (YouTube or Instagram)", name: "video_url", widget: "string", required: false, hint: "Paste a YouTube, YouTube Shorts, or Instagram Reel link here. Leave empty for text-only posts." }
      - { label: "Body", name: "body", widget: "markdown" }