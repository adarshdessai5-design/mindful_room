backend:
  name: github
  repo: adarshdessai5-design/mindful_room
  branch: main
  base_url: https://mindfulroom.vercel.app
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "YouTube Video URL", name: "video_url", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
