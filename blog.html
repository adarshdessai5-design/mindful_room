<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | The Mindful Room</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script async src="//www.instagram.com/embed.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F0EFE6; --ink: #1F2E23; --ink-soft: #43524a;
      --sage: #6B7F5E; --sage-deep: #4B5C40; --sand: #C9A876;
    }
    body { font-family: "Inter", sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 0; line-height: 1.6; }
    .nav { padding: 20px 40px; border-bottom: 1px solid rgba(0,0,0,0.1); background: rgba(240,239,230,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
    .nav a { color: var(--ink); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    .nav a:hover { color: var(--sage-deep); }
    .header-section { max-width: 1000px; margin: 60px auto 40px; padding: 0 20px; text-align: center; }
    .header-section h1 { font-family: "Fraunces", serif; font-size: 3rem; margin: 0 0 10px 0; font-weight: 600; }
    .header-section p { color: var(--ink-soft); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
    
    /* Grid Layout */
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; max-width: 1100px; margin: 0 auto 80px; padding: 0 20px; }
    
    /* Professional Cards */
    .blog-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.04); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; border: 1px solid rgba(0,0,0,0.05); }
    .blog-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
    
    /* Thumbnails */
    .card-image-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: var(--sage); cursor: pointer; overflow: hidden; }
    .card-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .blog-card:hover .card-image { transform: scale(1.05); }
    .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); pointer-events: none; }
    .play-btn svg { width: 24px; height: 24px; fill: var(--sage-deep); margin-left: 4px; }

    .card-content { padding: 24px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-date { font-size: 0.8rem; color: var(--sage-deep); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 8px; }
    .card-title { font-family: "Fraunces", serif; font-size: 1.4rem; margin: 0 0 12px 0; line-height: 1.3; font-weight: 600; }
    .card-excerpt { color: var(--ink-soft); font-size: 0.95rem; margin: 0 0 20px 0; flex-grow: 1; }
    .read-more-btn { align-self: flex-start; padding: 10px 20px; background: var(--sage-deep); color: #fff; text-decoration: none; border-radius: 30px; font-weight: 500; font-size: 0.9rem; transition: background 0.2s; border: none; cursor: pointer; }
    .read-more-btn:hover { background: var(--sage); }
    
    /* Modal for Full Post */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(31,46,35,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-start; z-index: 1000; overflow-y: auto; padding: 40px 20px; opacity: 0; transition: opacity 0.3s; }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-content { background: var(--bg); width: 100%; max-width: 800px; border-radius: 12px; padding: 40px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: translateY(20px); transition: transform 0.3s; }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .close-modal { position: absolute; top: 20px; right: 20px; background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: var(--ink-soft); }
    .modal-content h1 { font-family: "Fraunces", serif; font-size: 2.5rem; margin-top: 0; margin-bottom: 15px; }
    .modal-video { margin: 20px 0; width: 100%; border-radius: 8px; overflow: hidden; }
    .modal-video iframe { width: 100%; aspect-ratio: 16/9; border: none; }
    .modal-text { font-size: 1.05rem; color: var(--ink-soft); line-height: 1.8; }
    
    /* Share Button */
    .share-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--bg-alt); border: 1px solid var(--border-subtle); border-radius: 20px; color: var(--ink); font-size: 0.9rem; font-weight: 500; cursor: pointer; margin-bottom: 20px; transition: all 0.2s; }
    .share-btn:hover { background: var(--sage); color: white; border-color: var(--sage); }
    
    .instagram-container { display: flex; justify-content: center; width: 100%; margin-bottom: 20px; }
    @media (max-width: 600px) { .header-section h1 { font-size: 2.2rem; } .modal-content { padding: 24px; } }
  </style>
</head>
<body>
  <div class="nav">
    <a href="index.html">&larr; Back to The Mindful Room</a>
  </div>
  
  <div class="header-section">
    <h1>Blog & Reflections</h1>
    <p>Thoughts on therapy, mental wellness, and navigating life's transitions.</p>
  </div>

  <div class="blog-grid" id="blog-grid">Loading...</div>

  <div class="modal-overlay" id="post-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    let allPosts = [];

    async function loadPosts() {
      const repo = "adarshdessai5-design/mindful_room";
      const url = "https://api.github.com/repos/" + repo + "/contents/content/blog";
      const grid = document.getElementById("blog-grid");

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("API Error");
        const files = await response.json();
        
        if (files.length === 0) {
          grid.innerHTML = "<p style='text-align:center; width:100%;'>No posts yet. Check back soon!</p>";
          return;
        }

        const mdFiles = files.filter(f => f.name.endsWith(".md")).sort((a, b) => b.name.localeCompare(a.name));

        for (let i = 0; i < mdFiles.length; i++) {
          const file = mdFiles[i];
          const rawUrl = "https://raw.githubusercontent.com/" + repo + "/main/content/blog/" + file.name;
          const res = await fetch(rawUrl);
          const markdown = await res.text();

          let title = "Untitled"; let videoUrl = ""; let coverImage = ""; let dateStr = ""; let contentBody = markdown;

          const fmRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
          const match = markdown.match(fmRegex);

          if (match) {
            const fm = match[1]; contentBody = match[2];
            const getVal = (key) => { const line = fm.split("\n").find(l => l.trim().startsWith(key + ":")); return line ? line.replace(new RegExp("^" + key + ":\\s*"), "").trim().replace(/^["']|["']$/g, "") : ""; };
            
            title = getVal("title") || title;
            videoUrl = getVal("video_url");
            coverImage = getVal("cover_image");
            dateStr = getVal("date");
          }

          // Slug for sharing URL
          const slug = file.name.replace(".md", "");

          let thumbSrc = coverImage;
          let isYouTube = false; let ytId = "";
          if (videoUrl && (videoUrl.includes("youtube.com") || videoUrl.includes("youtu.be"))) {
            isYouTube = true;
            if (videoUrl.includes("youtu.be/")) ytId = videoUrl.split("youtu.be/")[1].split("?")[0];
            else if (videoUrl.includes("shorts/")) ytId = videoUrl.split("shorts/")[1].split("?")[0];
            else if (videoUrl.includes("v=")) ytId = videoUrl.split("v=")[1].split("&")[0];
            if (!thumbSrc && ytId) thumbSrc = "https://img.youtube.com/vi/" + ytId + "/maxresdefault.jpg";
          }

          if (!thumbSrc) thumbSrc = "https://images.unsplash.com/photo-1520694478166-daaaaec95b69?q=80&w=800&auto=format&fit=crop";

          allPosts.push({ title, videoUrl, contentBody, dateStr, thumbSrc, isYouTube, ytId, slug });

          const excerpt = marked.parse(contentBody).replace(/<[^>]+>/g, "").substring(0, 100) + "...";
          const formattedDate = dateStr ? new Date(dateStr).toLocaleDateString("en-IN", { month: "short", day: "numeric", year: "numeric" }) : "";

          const card = document.createElement("div");
          card.className = "blog-card";
          card.innerHTML = `
            <div class="card-image-wrapper" onclick="openPost(${i})">
              <img src="${thumbSrc}" class="card-image" alt="${title}">
              ${videoUrl ? `<div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>` : ``}
            </div>
            <div class="card-content">
              ${formattedDate ? `<div class="card-date">${formattedDate}</div>` : ``}
              <h2 class="card-title">${title}</h2>
              <p class="card-excerpt">${excerpt}</p>
              <button class="read-more-btn" onclick="openPost(${i})">Read Article</button>
            </div>
          `;
          grid.appendChild(card);
        }
        
        // Check if URL has a specific post hash to open automatically
        checkHashAndOpen();
        
      } catch (error) {
        console.error(error);
        grid.innerHTML = "<p style='text-align:center; width:100%;'>Error loading posts.</p>";
      }
    }

    function openPost(index, updateHash = true) {
      const post = allPosts[index];
      const modalBody = document.getElementById("modal-body");
      const modal = document.getElementById("post-modal");
      
      let videoHtml = "";
      if (post.videoUrl) {
        if (post.isYouTube && post.ytId) {
          videoHtml = `<div class="modal-video"><iframe src="https://www.youtube.com/embed/${post.ytId}" allowfullscreen></iframe></div>`;
        } else if (post.videoUrl.includes("instagram.com")) {
          videoHtml = `<div class="instagram-container"><blockquote class="instagram-media" data-instgrm-permalink="${post.videoUrl}" data-instgrm-version="14" style="max-width:540px; width:100%;"></blockquote></div>`;
        }
      }

      const formattedDate = post.dateStr ? new Date(post.dateStr).toLocaleDateString("en-IN", { weekday: "long", year: "numeric", month: "long", day: "numeric" }) : "";
      
      // Create shareable URL
      const shareUrl = window.location.origin + window.location.pathname + "#" + post.slug;

      modalBody.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div class="card-date">${formattedDate}</div>
          <button class="share-btn" onclick="copyLink('${shareUrl}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            Copy Link
          </button>
        </div>
        <h1>${post.title}</h1>
        ${videoHtml}
        <div class="modal-text">${marked.parse(post.contentBody)}</div>
      `;

      modal.classList.add("active");
      document.body.style.overflow = "hidden";

      if (updateHash) {
        window.history.pushState(null, null, "#" + post.slug);
      }

      if (post.videoUrl && post.videoUrl.includes("instagram.com") && window.instgrm) {
        window.instgrm.Embeds.process();
      }
    }

    function closeModal() {
      document.getElementById("post-modal").classList.remove("active");
      document.body.style.overflow = "auto";
      // Remove hash from URL without reloading
      window.history.pushState(null, null, window.location.pathname);
    }

    // Copy link function
    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.share-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '✅ Copied!';
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
      });
    }

    // Check if user opened a specific shared link
    function checkHashAndOpen() {
      const hash = window.location.hash.substring(1);
      if (hash) {
        const index = allPosts.findIndex(p => p.slug === hash);
        if (index !== -1) openPost(index, false);
      }
    }

    document.getElementById("post-modal").addEventListener("click", function(e) {
      if (e.target === this) closeModal();
    });

    loadPosts();
  </script>
</body>
</html>
