<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | The Mindful Room</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #F0EFE6; color: #1F2E23; margin: 0; padding: 0; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    h1, h2 { font-family: 'Fraunces', serif; }
    .blog-post { background: #fff; padding: 30px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 20px; border-radius: 8px; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    a { color: #4B5C40; text-decoration: none; font-weight: 500; }
    .nav { padding: 20px 40px; border-bottom: 1px solid rgba(0,0,0,0.1); margin-bottom: 40px; }
    .nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="index.html">&larr; Back to The Mindful Room</a>
  </div>
  <div class="container">
    <h1>Blog & Reflections</h1>
    <div id="blog-list">Loading posts...</div>
  </div>

  <script>
    async function loadPosts() {
      // Your GitHub repo
      const repo = 'adershdessai-cloud/mindful'; 
      const url = `https://api.github.com/repos/${repo}/contents/content/blog`;
      const blogList = document.getElementById('blog-list');

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('No posts found');
        const files = await response.json();
        
        blogList.innerHTML = '';

        if (files.length === 0) {
          blogList.innerHTML = '<p>No posts yet. Check back soon!</p>';
          return;
        }

        // Sort posts newest first
        files.sort((a, b) => b.name.localeCompare(a.name));

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const postResponse = await fetch(file.download_url);
            const markdown = await postResponse.text();
            
            const parts = markdown.split('---');
            const frontmatter = parts[1];
            const contentBody = parts.slice(2).join('---');

            const titleMatch = frontmatter.match(/title:\s*["']?(.*?)["']?\n/);
            const videoMatch = frontmatter.match(/video_url:\s*["']?(.*?)["']?\n/);
            
            const title = titleMatch ? titleMatch[1] : 'Untitled Post';
            let videoHtml = '';
            
            if (videoMatch && videoMatch[1]) {
              const vidUrl = videoMatch[1];
              let vidId = '';
              if (vidUrl.includes('youtu.be/')) vidId = vidUrl.split('youtu.be/')[1].split('?')[0];
              else if (vidUrl.includes('v=')) vidId = vidUrl.split('v=')[1].split('&')[0];
              
              if (vidId) {
                videoHtml = `<div class="video-container"><iframe src="https://www.youtube.com/embed/${vidId}" frameborder="0" allowfullscreen></iframe></div>`;
              }
            }

            const htmlContent = marked.parse(contentBody);

            const postHtml = `
              <div class="blog-post">
                <h2>${title}</h2>
                ${videoHtml}
                <div>${htmlContent}</div>
              </div>
            `;
            blogList.innerHTML += postHtml;
          }
        }
      } catch (error) {
        console.error(error);
        blogList.innerHTML = '<p>No blog posts yet. Check back soon!</p>';
      }
    }

    loadPosts();
  </script>
</body>
</html>
