<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | The Mindful Room</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script async src="//www.instagram.com/embed.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Inter", sans-serif; background: #F0EFE6; color: #1F2E23; margin: 0; padding: 0; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    h1, h2 { font-family: "Fraunces", serif; }
    .blog-post { background: #fff; padding: 30px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 20px; border-radius: 8px; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .instagram-container { display: flex; justify-content: center; margin-bottom: 20px; width: 100%; max-width: 540px; margin-left: auto; margin-right: auto; }
    a { color: #4B5C40; text-decoration: none; font-weight: 500; }
    .nav { padding: 20px 40px; border-bottom: 1px solid rgba(0,0,0,0.1); margin-bottom: 40px; }
    .nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="index.html">&larr; Back to The Mindful Room</a>
  </div>
  <div class="container">
    <h1>Blog & Reflections</h1>
    <div id="blog-list">Loading posts...</div>
  </div>

  <script>
    async function loadPosts() {
      const repo = "adarshdessai5-design/mindful_room";
      const url = "https://api.github.com/repos/" + repo + "/contents/content/blog";
      const blogList = document.getElementById("blog-list");

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("API Error");
        const files = await response.json();
        
        blogList.innerHTML = "";

        if (files.length === 0) {
          blogList.innerHTML = "<p>No posts yet. Check back soon!</p>";
          return;
        }

        const mdFiles = files.filter(f => f.name.endsWith(".md"));
        mdFiles.sort((a, b) => b.name.localeCompare(a.name));

        for (const file of mdFiles) {
          const rawUrl = "https://raw.githubusercontent.com/" + repo + "/main/content/blog/" + file.name;
          const postResponse = await fetch(rawUrl);
          const markdown = await postResponse.text();

          let title = "Untitled Post";
          let videoUrl = "";
          let contentBody = markdown;

          // This regex splits the YAML frontmatter from the body text perfectly
          const fmRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
          const match = markdown.match(fmRegex);

          if (match) {
            const frontmatter = match[1];
            contentBody = match[2];
            
            const titleLine = frontmatter.split("\n").find(l => l.trim().startsWith("title:"));
            if (titleLine) title = titleLine.replace(/^title:\s*/, "").trim().replace(/^["']|["']$/g, "");

            const videoLine = frontmatter.split("\n").find(l => l.trim().startsWith("video_url:"));
            if (videoLine) videoUrl = videoLine.replace(/^video_url:\s*/, "").trim().replace(/^["']|["']$/g, "");
          }

          let videoHtml = "";
          if (videoUrl && videoUrl !== "null") {
            if (videoUrl.includes("youtube.com") || videoUrl.includes("youtu.be")) {
              let vidId = "";
              if (videoUrl.includes("youtu.be/")) vidId = videoUrl.split("youtu.be/")[1].split("?")[0];
              else if (videoUrl.includes("shorts/")) vidId = videoUrl.split("shorts/")[1].split("?")[0];
              else if (videoUrl.includes("v=")) vidId = videoUrl.split("v=")[1].split("&")[0];
              
              if (vidId) {
                videoHtml = `<div class="video-container"><iframe src="https://www.youtube.com/embed/${vidId}" frameborder="0" allowfullscreen></iframe></div>`;
              }
            } else if (videoUrl.includes("instagram.com")) {
              videoHtml = `<div class="instagram-container"><blockquote class="instagram-media" data-instgrm-permalink="${videoUrl}" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin:1px; max-width:540px; min-width:326px; padding:0; width:calc(100% - 2px);"><a href="${videoUrl}" target="_blank">View this post on Instagram</a></blockquote></div>`;
            }
          }

          const htmlContent = marked.parse(contentBody);

          const postHtml = `
            <div class="blog-post">
              <h2>${title}</h2>
              ${videoHtml}
              <div>${htmlContent}</div>
            </div>
          `;
          blogList.innerHTML += postHtml;
        }

        if (window.instgrm && window.instgrm.Embeds) {
          window.instgrm.Embeds.process();
        }
      } catch (error) {
        console.error(error);
        blogList.innerHTML = "<p>No blog posts yet. Check back soon!</p>";
      }
    }
    loadPosts();
  </script>
</body>
</html>
